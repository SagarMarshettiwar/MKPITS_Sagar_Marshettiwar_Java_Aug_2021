apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.trustbank"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName "1.0.1"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        lintOptions {
            checkReleaseBuilds false
            abortOnError false
        }

        buildConfigField "String", "aes_key" ,'"AES"'
        buildConfigField "String", "pkcs7_key" ,'"AES/ECB/PKCS7Padding"'
        buildConfigField "String", "nop_key" ,'"AES/ECB/NoPadding"'
        buildConfigField "String", "enc_key" ,'"AP87TsvPTi2Aul1ipZrT3J4fNm4/LbhNLoX0i2WogFQ="'
        buildConfigField "String", "api_key" ,'"7jth/XWjfImtF4xY9TLYQbTZJAfC8ZiiZa5jfzOf3rM="'
    }

    signingConfigs {
        release {
            storeFile file('mBankJKS.jks')
            storePassword 'tssipl'
            keyAlias 'tssipl'
            keyPassword 'tssipl'
            enableV3Signing true
        }
    }


    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "content"
    productFlavors {

        ptiobank {
            applicationId "com.trustbank"
            applicationIdSuffix ".ptio"
            versionName "1.0.1"
            versionCode 1
            resValue "string", "app_name", "PTIO"
            manifestPlaceholders = [
                    appIcon: "@drawable/ptio_appic",google_maps_key:"AIzaSyCpgsg7pRAgRHQY27RO1tl4oQUKieyFLWs"
            ]
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.3.2'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'de.hdodenhof:circleimageview:2.2.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation files('libs/android-zoom-view.jar')
    implementation files('libs/jsoup-1.6.0.jar')
    implementation project(':library')
    implementation 'de.hdodenhof:circleimageview:2.2.0'
    implementation 'com.theartofdev.edmodo:android-image-cropper:2.5.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.github.bumptech.glide:annotations:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation project(':floatingbuttonlibrary')
    implementation files('libs/jxl-2.6.12.jar')
    implementation files('libs/itextg-5.5.8.jar')
    implementation "com.madgag.spongycastle:prov:1.54.0.0"
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.jakewharton:butterknife:10.0.0'
    implementation 'com.google.android.gms:play-services-auth:20.6.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'
    implementation 'com.github.smart-fun:XmlToJson:1.5.3'
    implementation 'com.google.android.play:core:1.10.3'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.zxing:core:3.3.3'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'io.github.chaosleung:pinview:1.4.4'
    implementation group: 'com.ibm.icu', name: 'icu4j', version: '51.1'
    implementation 'androidx.biometric:biometric:1.0.1'
}
