<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Document</title>
</head>
<body>
    <h1>This is my Home Page</h1>
    <h2 th:text="${name}"></h2>
    <h2 th:text="${#strings.toUpperCase(name)}"></h2>
    <h2 th:text="${date}"></h2>
    <h2>My name is <span th:text="${name}"></span></h2>
    <h2 th:text="'My real name is ' + ${name}"></h2>
    <div th:with="a=5, b=10">
    	<h1>value of a <span th:text="${a}"></span></h1>
    	<h1>value of b <span th:text="${b}"></span></h1>
    	<h1>value of a+b <span th:text="${b + a}"></span></h1>
    </div>
</body>
</html>
